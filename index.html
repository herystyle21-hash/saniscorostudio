<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <title>Sanis Studio — Instagram Microblog Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark" aria-hidden="true">SC</div>
      <div>
        <div class="brand-title">SANIS STUDIO</div>
        <div class="brand-sub"><span class="dot"></span> READY • 1440PX MASTER</div>
      </div>
    </div>

    <nav class="desktop-tabs" aria-label="Menu Studio">
      <button class="tab-btn" data-tab="style">01 GAYA &amp; BRAND</button>
      <button class="tab-btn active" data-tab="editor">02 TEKS &amp; FOTO</button>
      <button class="tab-btn" data-tab="slides">03 CAROUSEL</button>
      <button class="tab-btn" data-tab="caption">04 CAPTION &amp; IG</button>
    </nav>

    <div class="top-actions">
      <button class="btn-ghost" id="btnResetProject" title="Reset Proyek">↺ Reset</button>
      <button class="btn-light" id="btnExportAll">EXPORT ALL ↗</button>
    </div>
  </header>

  <main class="workspace">
    <!-- STAGE PREVIEW -->
    <section class="stage-panel active-mobile" id="mobilePreviewSection">
      <div class="stage-hud">
        <div class="hud-group">
          <button class="hud-btn" id="prevSlideBtn" aria-label="Slide Sebelumnya">◀</button>
          <span class="hud-counter" id="slideCounter">1 / 3</span>
          <button class="hud-btn" id="nextSlideBtn" aria-label="Slide Berikutnya">▶</button>
        </div>
        <div class="hud-group">
          <button class="hud-btn" id="toggleRatioBtn">4:5 PORTRAIT</button>
          <button class="hud-btn" id="toggleQualityBtn">1440PX HD</button>
        </div>
      </div>

      <div class="canvas-frame" id="canvasTouchArea">
        <canvas id="previewCanvas" width="1080" height="1350"></canvas>
      </div>

      <div class="stage-footer-actions">
        <button class="btn-dark" id="btnDownloadCurrent">⬇ Unduh PNG Slide Ini</button>
        <button class="btn-accent" id="btnShareIGCurrent">Post ke IG ↗</button>
      </div>
    </section>

    <!-- SIDEBAR EDITOR -->
    <aside class="editor-panel" id="mobileEditorSection">
      <!-- TAB 01: GAYA & BRAND -->
      <div class="tab-pane" id="pane-style">
        <div class="bento-card">
          <div class="kicker">ARSITEKTUR TEMPLATE</div>
          <div class="template-grid" id="templateSelector">
            <button class="tpl-card active" data-tpl="breaking">
              <span class="tpl-icon">🔥</span>
              <span class="tpl-name">Breaking Fade</span>
            </button>
            <button class="tpl-card" data-tpl="editorial">
              <span class="tpl-icon">🏛️</span>
              <span class="tpl-name">Editorial Studio</span>
            </button>
            <button class="tpl-card" data-tpl="fintech">
              <span class="tpl-icon">🪙</span>
              <span class="tpl-name">Fintech 3-Coin</span>
            </button>
          </div>
        </div>

        <div class="bento-card">
          <div class="kicker">PALET &amp; WARNA AKSEN</div>
          <div class="row-2">
            <div>
              <label class="field-label">Mode Tema</label>
              <select id="themeMode" class="input">
                <option value="dark">Matte Charcoal (#121215)</option>
                <option value="fresh">Hitam Putih Fresh</option>
              </select>
            </div>
            <div>
              <label class="field-label">Warna Sorotan [[...]]</label>
              <div class="color-row">
                <input type="color" id="accentColor" value="#E11D2A" />
                <button class="chip-btn" data-color="#E11D2A" style="background:#E11D2A"></button>
                <button class="chip-btn" data-color="#22C55E" style="background:#22C55E"></button>
                <button class="chip-btn" data-color="#3B82F6" style="background:#3B82F6"></button>
                <button class="chip-btn" data-color="#F59E0B" style="background:#F59E0B"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="bento-card">
          <div class="kicker">IDENTITAS LOGO &amp; HANDLE</div>
          <div class="row-2">
            <div>
              <label class="field-label">Gaya Logo</label>
              <select id="logoMode" class="input">
                <option value="sc_vector">SC SANIS CORO 57 CREATOR 58</option>
                <option value="monogram">Monogram + Kotak Aksen</option>
                <option value="custom">Upload Logo Kustom</option>
              </select>
            </div>
            <div>
              <label class="field-label">Teks Monogram</label>
              <input type="text" id="brandMono" class="input" value="SC" maxlength="10" />
            </div>
          </div>
          <div class="mt-10">
            <label class="field-label">Kapsul Sosial Media / Footer</label>
            <input type="text" id="socialHandle" class="input" value="Tiktok & IG | @saniscoro" />
          </div>
          <div class="mt-10 upload-inline">
            <label class="btn-dark small-btn" for="logoUploadInput">📁 Upload Logo PNG</label>
            <input type="file" id="logoUploadInput" accept="image/png,image/jpeg,image/webp" hidden />
            <button class="btn-ghost small-btn" id="btnClearLogo">↺ Default SC</button>
          </div>
        </div>
      </div>

      <!-- TAB 02: EDITOR TEKS & BACKGROUND -->
      <div class="tab-pane active" id="pane-editor">
        <div class="bento-card">
          <div class="card-head-row">
            <span class="kicker">BACKGROUND &amp; GRADASI SLIDE</span>
            <button class="link-btn" id="btnApplyBgAll">Terapkan ke Semua</button>
          </div>

          <div class="drop-zone" id="bgDropZone">
            <div class="drop-preview" id="bgThumbWrap">
              <img id="bgThumbImg" alt="Preview Background" />
              <span id="bgPlaceholderText">Klik Upload, Seret Foto, atau Paste (Ctrl+V)</span>
            </div>
            <div class="drop-actions">
              <label class="btn-light small-btn" for="bgFileInput">📷 Upload Foto</label>
              <input type="file" id="bgFileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
              <button class="btn-ghost small-btn" id="btnRemoveBg">Hapus</button>
            </div>
          </div>

          <div class="preset-row">
            <button class="preset-btn" data-preset="fire">🔥 Crypto Fire</button>
            <button class="preset-btn" data-preset="bullish">📈 Bullish</button>
            <button class="preset-btn" data-preset="cyber">🌐 Cyber Blue</button>
            <button class="preset-btn" data-preset="clean">⬜ Studio Grid</button>
          </div>

          <div class="slider-grid">
            <div>
              <label class="field-label">Titik Mulai Hitam: <span id="valFadeStart">42%</span></label>
              <input type="range" id="fadeStart" min="15" max="80" value="42" />
            </div>
            <div>
              <label class="field-label">Kepekatan Gradasi: <span id="valFadeOpacity">100%</span></label>
              <input type="range" id="fadeOpacity" min="0" max="100" value="100" />
            </div>
            <div>
              <label class="field-label">Geser Foto (Y): <span id="valImgY">0%</span></label>
              <input type="range" id="imgOffsetY" min="-40" max="40" value="0" />
            </div>
            <div>
              <label class="field-label">Zoom Foto: <span id="valImgZoom">100%</span></label>
              <input type="range" id="imgZoom" min="80" max="160" value="100" />
            </div>
          </div>
        </div>

        <div class="bento-card">
          <div class="card-head-row">
            <span class="kicker">TEKS UTAMA &amp; SOROTAN</span>
            <button class="link-btn" id="btnHighlightSelection">✨ Sorot [[Teks]]</button>
          </div>

          <div class="row-2">
            <div>
              <label class="field-label">Jenis Slide</label>
              <select id="slideType" class="input">
                <option value="cover">Cover Utama</option>
                <option value="content">Slide Isi / Poin</option>
                <option value="closing">Penutup / CTA</option>
              </select>
            </div>
            <div>
              <label class="field-label">Kicker / Kategori</label>
              <input type="text" id="slideKicker" class="input" placeholder="BREAKING NEWS" />
            </div>
          </div>

          <div class="mt-10">
            <label class="field-label">Judul Utama (Gunakan [[kata]] untuk warna aksen)</label>
            <textarea id="slideTitle" class="input textarea" rows="3"></textarea>
          </div>

          <div class="mt-10">
            <label class="field-label">Subjudul / Ringkasan</label>
            <textarea id="slideSubtitle" class="input textarea" rows="2"></textarea>
          </div>

          <div class="mt-10">
            <div class="card-head-row">
              <label class="field-label">Daftar Poin Pembahasan</label>
              <button class="link-btn" id="btnAddBullet">+ Tambah Poin</button>
            </div>
            <div id="bulletsContainer" class="bullets-list"></div>
          </div>

          <div class="mt-10">
            <label class="field-label">Kutipan / Catatan Sumber (Opsional)</label>
            <input type="text" id="slideQuote" class="input" placeholder="Sumber: Analisis Pasar & On-Chain" />
          </div>
        </div>
      </div>

      <!-- TAB 03: SUSUNAN CAROUSEL -->
      <div class="tab-pane" id="pane-slides">
        <div class="bento-card">
          <div class="card-head-row">
            <span class="kicker">DAFTAR SLIDE (MAKS 10)</span>
            <button class="btn-light small-btn" id="btnAddSlide">+ Slide Baru</button>
          </div>
          <div id="slideListContainer" class="slide-cards"></div>
        </div>
      </div>

      <!-- TAB 04: CAPTION OTOMATIS & POST INSTAGRAM -->
      <div class="tab-pane" id="pane-caption">
        <div class="bento-card">
          <div class="card-head-row">
            <span class="kicker">CAPTION &amp; HASHTAG OTOMATIS</span>
            <button class="link-btn" id="btnRegenCaption">↻ Buat Ulang</button>
          </div>

          <div class="row-2">
            <div>
              <label class="field-label">Gaya Penulisan</label>
              <select id="captionTone" class="input">
                <option value="breaking">Breaking News (Tegas)</option>
                <option value="analysis">Edukasi &amp; Analisis</option>
                <option value="punchy">Singkat &amp; Punchy</option>
              </select>
            </div>
            <div>
              <label class="field-label">Elemen Tambahan</label>
              <div class="toggle-pills">
                <button class="pill-toggle active" id="togEmoji">Emoji</button>
                <button class="pill-toggle active" id="togCta">CTA</button>
                <button class="pill-toggle active" id="togTags">#Tag</button>
              </div>
            </div>
          </div>

          <div class="mt-10">
            <textarea id="captionOutput" class="input textarea caption-box" rows="9"></textarea>
          </div>

          <div class="action-stack mt-10">
            <button class="btn-dark" id="btnCopyCaption">📋 Salin Caption ke Clipboard</button>
            <button class="btn-accent" id="btnShareAllIG">📲 Post Semua Slide + Caption ke IG ↗</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav" aria-label="Navigasi Ponsel">
    <button class="mnav-btn active" data-mview="preview"><span>🖼️</span>Pratinjau</button>
    <button class="mnav-btn" data-mview="style"><span>🎨</span>Gaya</button>
    <button class="mnav-btn" data-mview="editor"><span>✏️</span>Teks &amp; Foto</button>
    <button class="mnav-btn" data-mview="slides"><span>📑</span>Slide</button>
    <button class="mnav-btn" data-mview="caption"><span>📲</span>Post IG</button>
  </nav>

  <div class="toast" id="toastBox" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
